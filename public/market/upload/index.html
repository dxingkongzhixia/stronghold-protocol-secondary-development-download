<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传插件 · Stronghold Protocol</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/market/market.css">
</head>
<body class="market-page">
  <main class="market-shell">
    <div class="market-upload">
      <p class="market-crumbs"><a href="/market/">插件商城</a> / 上传</p>
      <h1>上传插件</h1>
      <p class="market-sub">上传后状态为「未审核」。管理员测试通过后才会变为「使用中」并开放下载。</p>
      <p class="market-compat-help">兼容性：本服 0.4.0 · 主线 0.3.x 的外观 / 界面 / 语言插件自动兼容；内容 / 脚本 / 信任插件默认严格，需 owner 在 allowIncompatible 中放行。插件类型由 plugin.json 的 class 决定。</p>
      <form class="market-form" id="uploadForm">
        <div>
          <label for="kind">来源格式</label>
          <select id="kind" name="kind">
            <option value="ordinary">普通插件（plugin.json）</option>
            <option value="forge">Forge 包（pack.json）</option>
          </select>
        </div>
        <div>
          <label for="zip">zip 文件</label>
          <input id="zip" name="zip" type="file" accept=".zip,application/zip" required>
        </div>
        <button class="mc-btn mc-btn--primary" type="submit" id="submit">上传并提交审核</button>
        <p id="msg" class="market-status"></p>
      </form>
      <p class="market-note">不要上传官方游戏文件；Forge 包只支持部分转换。安装 zip 时请注意来源和校验值。</p>
    </div>
  </main>
  <script type="module" src="/js/market-upload.js"></script>
</body>
</html>
