<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插件商城 · Stronghold Protocol</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/market/market.css">
</head>
<body class="market-page">
  <main class="market-shell">
    <header class="market-head">
      <div>
        <div class="market-kicker">STRONGHOLD PROTOCOL // PLUGIN STORE</div>
        <h1 class="market-title">插件商城</h1>
        <p class="market-sub">普通插件与 Forge 包分开存储；上传后待审核，使用中的插件才开放下载。</p>
      </div>
      <div class="market-actions">
        <button type="button" class="mc-btn" id="back">返回游戏</button>
        <a class="mc-btn mc-btn--primary" href="/market/upload/">上传插件</a>
      </div>
    </header>

    <div class="market-toolbar">
      <div class="market-tabs" role="tablist">
        <button class="market-tab is-on" data-tab="ordinary" role="tab">普通插件 <em id="count-ordinary">0</em></button>
        <button class="market-tab" data-tab="forge" role="tab">Forge 包 <em id="count-forge">0</em></button>
        <button class="market-tab" data-tab="installed" role="tab">本机已安装 <em id="count-installed">0</em></button>
      </div>
      <input id="search" class="market-search" type="search" placeholder="搜索名称 / 作者 / 描述 / 类型" aria-label="搜索插件">
    </div>
    <div id="list" class="market-list"></div>
    <p id="listMsg" class="market-status"></p>

    <section id="admin" class="market-admin" hidden>
      <h2>待审核</h2>
      <p class="market-sub">测试通过后才能批准；审核不会把插件装进游戏服务器。</p>
      <div id="adminList" class="market-list"></div>
      <p id="adminMsg" class="market-status"></p>
    </section>

    <p class="market-note">
      插件为非官方内容。下载的 zip 请按服务器说明安装；Forge 包只支持部分转换。
      上传后需要管理员测试通过，才会开放下载。
    </p>
  </main>
  <script type="module" src="/js/market.js"></script>
</body>
</html>
