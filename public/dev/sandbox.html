<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>沙盒 · 卫戍协议：盟约</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Ccircle cx='12' cy='12' r='6' fill='%23f0a35e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070a09; color: #c9d1cd;
      font: 12.5px/1.45 "Noto Sans SC", system-ui, sans-serif; }
    #field { position: fixed; inset: 0; width: 100%; height: 100%; }
    button, input, select { font: inherit; color: inherit; }
    .sb-panel { position: fixed; left: 12px; top: 12px; bottom: 64px; z-index: 6; width: 372px; padding: 12px 14px 20px;
      overflow-y: auto; overscroll-behavior: contain; background: rgba(10, 14, 13, .92);
      border: 1px solid #2c3833; border-radius: 3px; box-shadow: 0 8px 28px rgba(0, 0, 0, .5); }
    .sb-panel::-webkit-scrollbar { width: 8px; } .sb-panel::-webkit-scrollbar-thumb { background: #2c3833; }
    .sb-title { margin: 0 0 2px; font-size: 15px; font-weight: 600; color: #eef4f1; letter-spacing: .02em; }
    .sb-sub { margin: 0 0 10px; font-size: 11.5px; color: #7d8c86; }
    .sb-sec { margin: 0 0 12px; padding-top: 9px; border-top: 1px solid #223029; }
    .sb-sec h2 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 7px; font-size: 12.5px; font-weight: 600;
      color: #f0a35e; letter-spacing: .04em; }
    .sb-dim { color: #6f7d77; font-weight: 400; }
    .sb-search { width: 100%; box-sizing: border-box; margin: 0 0 6px; padding: 4px 7px; border: 1px solid #33413b;
      border-radius: 2px; background: #101613; color: #dfe7e3; }
    .sb-search:focus { outline: none; border-color: #f0a35e; }
    .sb-list { max-height: 148px; overflow-y: auto; border: 1px solid #223029; border-radius: 2px; margin-bottom: 6px; }
    .sb-count { padding: 3px 7px; font-size: 11px; color: #6f7d77; background: #0d1210; position: sticky; top: 0; }
    .sb-li { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 4px 7px;
      border: 0; border-top: 1px solid #18211d; background: transparent; text-align: left; cursor: pointer; }
    .sb-li:hover { background: #16201b; }
    .sb-li.is-on { background: #1d2a23; box-shadow: inset 2px 0 0 #f0a35e; }
    .sb-li b { font-weight: 500; color: #dfe7e3; }
    .sb-li .sb-dim { font-size: 10.5px; }
    .sb-more { width: 100%; padding: 4px; border: 0; border-top: 1px solid #18211d; background: #101613; color: #8fa39a; cursor: pointer; }
    .sb-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .sb-chip { padding: 3px 8px; border: 1px solid #33413b; border-radius: 2px; background: #141b18; color: #cfd8d4; cursor: pointer; }
    .sb-chip:hover { border-color: #4f6459; }
    .sb-chip.is-on { border-color: #f0a35e; color: #f0a35e; }
    .sb-loadout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 8px; }
    .sb-loadout label { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: #8b9a94; }
    .sb-loadout select, .sb-loadout input { min-width: 0; flex: 1 1 auto; padding: 2px 4px; border: 1px solid #33413b;
      border-radius: 2px; background: #101613; color: #dfe7e3; }
    .sb-check { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; color: #9faea8; }
    .sb-tiles { display: flex; flex-direction: column; align-items: center; gap: 1px; margin: 2px 0 8px; }
    .sb-tile-row { display: flex; gap: 1px; }
    .sb-tile { width: 12px; height: 12px; padding: 0; border: 0; background: #0d1a15; border-radius: 1px; }
    .sb-tile.is-legal { background: #2b4c43; cursor: pointer; }
    .sb-tile.is-legal:hover { background: #48796b; }
    .sb-tile.is-on { background: #f0a35e; box-shadow: 0 0 0 1px #ffd2a3; }

    .sb-btn { padding: 4px 9px; border: 1px solid #33413b; border-radius: 2px; background: #141b18; color: #cfd8d4; cursor: pointer; }
    .sb-btn:hover { border-color: #4f6459; color: #fff; }
    .sb-rowbtns { display: flex; flex-wrap: wrap; gap: 6px; }
    .sb-groups { display: flex; flex-direction: column; gap: 7px; margin: 6px 0; }
    .sb-group { padding: 6px 7px; border: 1px solid #2c3833; border-radius: 3px; background: #0e1512; }
    .sb-group__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .sb-group__head b { color: #dfe7e3; font-weight: 500; }
    .sb-x { border: 0; background: transparent; color: #a45a4c; cursor: pointer; font-size: 13px; }
    .sb-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 8px; }
    .sb-group__head { grid-column: 1 / -1; }
    .sb-group label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8b9a94; }
    .sb-group input, .sb-group select { min-width: 0; flex: 1 1 auto; width: 100%; padding: 2px 4px; border: 1px solid #33413b;
      border-radius: 2px; background: #101613; color: #dfe7e3; }
    .sb-note { margin: 4px 0 0; font-size: 11px; color: #6b7a74; }
    .sb-note code { color: #9faea8; }
    .sb-err { margin: 8px 0 0; font-size: 12px; color: #ff8f7a; white-space: pre-wrap; }
    .sb-err:empty { display: none; }

    .sb-stats { position: fixed; right: 12px; top: 12px; z-index: 6; width: 226px; padding: 10px 12px;
      background: rgba(10, 14, 13, .9); border: 1px solid #2c3833; border-radius: 3px; box-shadow: 0 8px 28px rgba(0, 0, 0, .5); }
    .sb-stats dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-variant-numeric: tabular-nums; }
    .sb-stats dt { color: #7d8c86; }
    .sb-stats dd { margin: 0; color: #dfe7e3; text-align: right; }
    .sb-stats dd b { color: #f0a35e; font-weight: 600; }
    .sb-result { margin-top: 7px; font-size: 12px; color: #f0a35e; }
    .sb-result:empty { display: none; }

    .sb-bar { position: fixed; left: 50%; bottom: 14px; z-index: 7; transform: translateX(-50%); display: flex; gap: 6px;
      padding: 7px 9px; background: rgba(10, 14, 13, .92); border: 1px solid #2c3833; border-radius: 3px; }
    .sb-bar button { flex: 0 0 auto; white-space: nowrap; padding: 5px 11px; border: 1px solid #33413b; border-radius: 2px; background: #141b18; color: #cfd8d4; cursor: pointer; }
    .sb-bar button:hover { border-color: #4f6459; color: #fff; }
    .sb-bar button.is-on { border-color: #f0a35e; color: #f0a35e; }
    .sb-bar .sb-time { padding: 5px 4px; color: #7d8c86; font-variant-numeric: tabular-nums; }

    .sb-start { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 9, 8, .82); }
    .sb-start button { padding: 14px 26px; font: 15px/1 "Noto Sans SC", system-ui, sans-serif; color: #0b0f0d;
      background: #f0a35e; border: 0; border-radius: 3px; cursor: pointer; box-shadow: 0 6px 22px rgba(0, 0, 0, .5); }
    .sb-start button:hover { background: #ffb974; }
    @media (max-width: 900px) {
      .sb-panel { width: auto; right: 12px; bottom: 74px; max-height: 46vh; }
      .sb-stats { display: none; }
    }
  </style>
</head>
<body>
  <div id="field"></div>
  <aside id="sbPanel" class="sb-panel"></aside>
  <section class="sb-stats">
    <dl>
      <dt>干员</dt><dd id="sbUnit">—</dd>
      <dt>技能</dt><dd id="sbSkill">—</dd>
      <dt>释放</dt><dd><b id="sbCasts">0</b> 次</dd>
      <dt>累计伤害</dt><dd><b id="sbDamage">0</b></dd>
      <dt>场上敌人</dt><dd id="sbEnemies">0</dd>
      <dt>击杀</dt><dd id="sbKills">0</dd>
      <dt>灼燃爆发</dt><dd><b id="sbBursts">0</b> · <span id="sbBurn">0</span>/1000</dd>
      <dt>音效</dt><dd id="sbAudio">未开启 · 点一下页面</dd>
    </dl>
    <div class="sb-result" id="sbResult"></div>
  </section>
  <nav class="sb-bar">
    <button type="button" id="sbPlay">▌▌ 暂停</button>
    <button type="button" id="sbStep" title="前进一秒">▶| 单步</button>
    <button type="button" id="sbRestart">↻ 重来</button>
    <button type="button" data-speed="1">1×</button>
    <button type="button" data-speed="2" class="is-on">2×</button>
    <button type="button" data-speed="4">4×</button>
    <button type="button" data-speed="8">8×</button>
    <button type="button" id="sbCopy">🔗 复制链接</button>
    <span class="sb-time" id="sbTime">0.0 / 0 s</span>
  </nav>
  <script type="module" src="./sandbox.js"></script>
  <div id="sbStart" class="sb-start"><button type="button" id="sbStartBtn">🔊 点击开始（浏览器需要一次点击才会出声）</button></div>
</body>
</html>
