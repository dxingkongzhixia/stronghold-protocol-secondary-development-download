<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>沙盒 · 卫戍协议：盟约</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Ccircle cx='12' cy='12' r='6' fill='%23f0a35e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #060907; color: var(--text, #c9d1cd);
      font: 12.5px/1.45 "Noto Sans SC", system-ui, sans-serif; }
    #field { position: fixed; inset: 0; width: 100%; height: 100%; }
    button, input, select { font: inherit; color: inherit; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .micro { font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: #6f7d77; font-weight: 600; }

    /* ---- left workbench -------------------------------------------------------------------------------------- */
    .sb-panel { position: fixed; left: 14px; top: 14px; bottom: 66px; z-index: 6; width: 392px; display: flex;
      flex-direction: column; background: linear-gradient(180deg, rgba(11,16,14,.97), rgba(8,12,10,.97));
      border: 1px solid rgba(120,200,175,.24); border-radius: 2px;
      box-shadow: 0 18px 48px rgba(0,0,0,.65), inset 0 1px 0 rgba(140,220,195,.10); }
    .sb-panel::before, .sb-panel::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; }
    .sb-panel::before { left: -1px; top: -1px; border-left: 2px solid var(--mint, #64d8b4); border-top: 2px solid var(--mint, #64d8b4); }
    .sb-panel::after { right: -1px; bottom: -1px; border-right: 2px solid var(--mint, #64d8b4); border-bottom: 2px solid var(--mint, #64d8b4); }

    .sb-head { padding: 12px 14px 10px; border-bottom: 1px solid rgba(120,200,175,.16);
      background: linear-gradient(180deg, rgba(100,216,180,.05), transparent); }
    .sb-head__meta { display: flex; align-items: center; gap: 6px; }
    .sb-head__meta b { color: var(--mint, #64d8b4); }
    .sb-head h1 { margin: 5px 0 0; font-size: 17px; font-weight: 600; letter-spacing: .05em; color: #eef5f1; }
    .sb-head h1 span { color: #f0a35e; font-weight: 500; }
    .sb-head__now { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 11.5px; color: #8b9a94; }
    .sb-head__now b { color: #dfe7e3; font-weight: 500; }
    .sb-head__now i { padding: 0 6px; border: 1px solid rgba(240,163,94,.45); color: #f0a35e; font-style: normal; font-size: 10.5px; }
    .sb-head__now em { margin-left: auto; color: #5f6d68; font-style: normal; font-size: 10.5px; }

    .sb-tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid rgba(120,200,175,.14); }
    .sb-tabs button { position: relative; padding: 9px 4px 8px; border: 0; background: transparent; cursor: pointer;
      font-size: 12px; letter-spacing: .08em; color: #7f8e88; }
    .sb-tabs button:hover { color: #cfd8d4; background: rgba(100,216,180,.04); }
    .sb-tabs button.is-on { color: var(--mint, #64d8b4); }
    .sb-tabs button.is-on::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -1px; height: 2px; background: var(--mint, #64d8b4); }

    .sb-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; scrollbar-width: thin; }
    .sb-body::-webkit-scrollbar { width: 8px; } .sb-body::-webkit-scrollbar-thumb { background: #24332c; }

    .sb-block { margin: 0 0 14px; }
    .sb-block:last-child { margin-bottom: 0; }
    .sb-block > h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
    .sb-block > h2 span { margin-left: auto; color: #7f8e88; letter-spacing: 0; font-size: 10.5px; font-weight: 400; }
    .sb-block > h2::after { content: ""; flex: 1 1 auto; height: 1px; background: linear-gradient(90deg, rgba(120,200,175,.22), transparent); }
    .sb-block > h2 span + ::after { display: none; }

    .sb-searchrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .sb-searchrow .sb-count { flex: 0 0 auto; color: #6f7d77; font-size: 10.5px; }
    .sb-search { flex: 1 1 auto; min-width: 0; height: 27px; box-sizing: border-box; padding: 0 8px;
      border: 1px solid #2a3a33; border-radius: 2px; background: #09110e; color: #dfe7e3; }
    .sb-search::placeholder { color: #55645e; }
    .sb-search:focus { outline: none; border-color: rgba(100,216,180,.7); box-shadow: 0 0 0 1px rgba(100,216,180,.15); }

    .sb-list { max-height: 206px; overflow-y: auto; border: 1px solid #1e2b25; border-radius: 2px; background: #080d0b; }
    .sb-list::-webkit-scrollbar { width: 7px; } .sb-list::-webkit-scrollbar-thumb { background: #24332c; }
    .sb-li { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
      padding: 5px 9px; border: 0; border-top: 1px solid #131d18; background: transparent; text-align: left; cursor: pointer; }
    .sb-li:first-child { border-top: 0; }
    .sb-li:hover { background: #111b16; }
    .sb-li.is-on { background: linear-gradient(90deg, rgba(240,163,94,.10), rgba(240,163,94,.02)); }
    .sb-li.is-on::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: #f0a35e; }
    .sb-li b { font-weight: 500; color: #dfe7e3; }
    .sb-li .sb-dim { font-size: 10.5px; color: #6f7d77; }
    .sb-more { width: 100%; padding: 5px; border: 0; border-top: 1px solid #131d18; background: #0a1210; color: #7f948b; cursor: pointer; }
    .sb-more:hover { color: #cfd8d4; }

    .sb-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .sb-chip { display: inline-flex; align-items: center; gap: 5px; height: 27px; padding: 0 10px; border: 1px solid #2a3a33;
      border-radius: 2px; background: #0a1210; color: #b9c6c1; cursor: pointer; }
    .sb-chip b { color: #7f948b; font-weight: 600; font-size: 10.5px; letter-spacing: .06em; }
    .sb-chip:hover { border-color: #3d564c; color: #fff; }
    .sb-chip.is-on { border-color: rgba(240,163,94,.7); color: #f0a35e; background: rgba(240,163,94,.08); }
    .sb-chip.is-on b { color: #f0a35e; }

    .sb-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 10px; }
    .sb-grid2 label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b9a94; }
    .sb-grid2 label > span { flex: 0 0 auto; }
    .sb-grid2 select, .sb-grid2 input[type=number] { flex: 1 1 auto; min-width: 0; height: 26px; padding: 0 5px;
      border: 1px solid #2a3a33; border-radius: 2px; background: #09110e; color: #dfe7e3; }

    .sb-btn { height: 27px; padding: 0 11px; border: 1px solid #2f4239; border-radius: 2px; background: #0e1713;
      color: #c4d0cb; cursor: pointer; white-space: nowrap; }
    .sb-btn:hover { border-color: #4f6b5e; color: #fff; background: #12201a; }
    .sb-rowbtns { display: flex; flex-wrap: wrap; gap: 6px; }

    /* deploy grid */
    .sb-tiles { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 6px;
      border: 1px solid #1e2b25; border-radius: 2px; background:
        radial-gradient(120% 80% at 50% 0%, rgba(100,216,180,.05), transparent 70%), #070c0a; }
    .sb-tile-row { display: flex; gap: 2px; }
    .sb-tile { width: 17px; height: 17px; padding: 0; border: 1px solid transparent; border-radius: 1px;
      background: #0b1410; cursor: default; }
    .sb-tile.is-legal { border-color: rgba(100,216,180,.30); background: rgba(100,216,180,.10); cursor: pointer; }
    .sb-tile.is-legal:hover { border-color: rgba(100,216,180,.85); background: rgba(100,216,180,.28); }
    .sb-tile.is-on { border-color: #ffd2a3; background: #f0a35e; box-shadow: 0 0 8px rgba(240,163,94,.55); }
    .sb-tiles__foot { display: flex; justify-content: space-between; width: 100%; margin-top: 7px; padding: 0 3px;
      font-size: 10px; color: #5f6d68; letter-spacing: .06em; }
    .sb-tiles__foot i { color: #f0a35e; font-style: normal; }

    /* switch */
    .sb-field { display: grid; gap: 4px; }
    .sb-field > select { height: 27px; padding: 0 6px; border: 1px solid #2a3a33; border-radius: 2px; background: #09110e; color: #dfe7e3; }
    .sb-team { display: flex; flex-direction: column; gap: 6px; }
    .sb-member { display: grid; grid-template-columns: 1fr 1fr auto auto; align-items: center; gap: 6px; }
    .sb-member select { min-width: 0; height: 25px; padding: 0 4px; border: 1px solid #263a31; border-radius: 2px; background: #09110e; color: #dfe7e3; }
    .sb-member .sb-dim { font-size: 10px; white-space: nowrap; }
    .sb-routes { margin: 0; padding: 0; list-style: none; }
    .sb-routes li { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-top: 1px solid #131d18; font-size: 11px; color: #a9b8b2; }
    .sb-routes li:first-child { border-top: 0; }
    .sb-routes i { color: #f0a35e; font-style: normal; width: 22px; }
    .sb-routes span { margin-left: auto; color: #6f7d77; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sb-boss__name { font-size: 14px; color: #eef5f1; letter-spacing: .03em; margin-bottom: 6px; }
    .sb-boss__dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 11px; }
    .sb-boss__dl dt { color: #7f8e88; }
    .sb-boss__dl dd { margin: 0; text-align: right; color: #dfe7e3; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sb-btn[disabled] { opacity: .4; cursor: default; }
    .sb-switch { display: flex; align-items: center; gap: 8px; margin: 0 0 9px; cursor: pointer; color: #a9b8b2; font-size: 11.5px; }
    .sb-switch input { appearance: none; width: 30px; height: 16px; margin: 0; border-radius: 8px; background: #1b2722;
      border: 1px solid #2f4239; position: relative; cursor: pointer; transition: background .15s; }
    .sb-switch input::after { content: ""; position: absolute; top: 1px; left: 1px; width: 12px; height: 12px; border-radius: 50%;
      background: #6b7a74; transition: transform .15s, background .15s; }
    .sb-switch input:checked { background: rgba(100,216,180,.25); border-color: rgba(100,216,180,.6); }
    .sb-switch input:checked::after { transform: translateX(14px); background: #64d8b4; }

    .sb-groups { display: flex; flex-direction: column; gap: 8px; margin: 9px 0; }
    .sb-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 10px; padding: 8px 9px;
      border: 1px solid #223029; border-left: 2px solid rgba(240,163,94,.55); border-radius: 2px; background: #0a1210; }
    .sb-group__head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    .sb-group__head b { color: #e6efea; font-weight: 500; }
    .sb-group__head span { color: #6f7d77; font-size: 10px; letter-spacing: .08em; }
    .sb-x { width: 20px; height: 20px; border: 1px solid transparent; border-radius: 2px; background: transparent;
      color: #a45a4c; cursor: pointer; line-height: 1; }
    .sb-x:hover { border-color: rgba(164,90,76,.5); color: #ff8f7a; }
    .sb-group label { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #7f8e88; }
    .sb-group label span { flex: 0 0 26px; }
    .sb-group input, .sb-group select { flex: 1 1 auto; min-width: 0; width: 100%; height: 24px; padding: 0 4px;
      border: 1px solid #263a31; border-radius: 2px; background: #07100c; color: #dfe7e3; }

    .sb-note { margin: 10px 0 0; font-size: 10.5px; color: #5f6d68; line-height: 1.6; }
    .sb-note code { color: #8fa39a; }
    .sb-err { margin: 8px 0 0; font-size: 11.5px; color: #ff8f7a; white-space: pre-wrap; }
    .sb-err:empty { display: none; }

    /* ---- telemetry ------------------------------------------------------------------------------------------- */
    .sb-stats { position: fixed; right: 14px; top: 14px; z-index: 6; width: 248px; padding: 11px 13px 12px;
      background: linear-gradient(180deg, rgba(11,16,14,.96), rgba(8,12,10,.96));
      border: 1px solid rgba(120,200,175,.22); border-radius: 2px; box-shadow: 0 14px 40px rgba(0,0,0,.55); }
    .sb-stats::before { content: ""; position: absolute; left: -1px; top: -1px; width: 12px; height: 12px;
      border-left: 2px solid #64d8b4; border-top: 2px solid #64d8b4; }
    .sb-stats__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .sb-stats__big { display: flex; align-items: baseline; gap: 7px; margin: 0 0 9px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(120,200,175,.14); }
    .sb-stats__big b { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 26px;
      line-height: 1; color: #f0a35e; font-weight: 600; }
    .sb-stats__big small { color: #7f8e88; font-size: 10.5px; }
    .sb-stats dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
    .sb-stats dt { color: #7f8e88; font-size: 11px; }
    .sb-stats dd { margin: 0; text-align: right; color: #dfe7e3; font-size: 11.5px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .sb-stats dd b { color: #f0a35e; font-weight: 600; }
    .sb-result { margin-top: 9px; padding-top: 8px; border-top: 1px solid rgba(120,200,175,.14); font-size: 11.5px; color: #f0a35e; }
    .sb-result:empty { display: none; }

    /* ---- bottom bar ------------------------------------------------------------------------------------------ */
    .sb-bar { position: fixed; left: 50%; bottom: 14px; z-index: 7; transform: translateX(-50%); display: flex;
      flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 20px); gap: 4px; padding: 6px;
      background: linear-gradient(180deg, rgba(12,18,15,.96), rgba(8,12,10,.96));
      border: 1px solid rgba(120,200,175,.22); border-radius: 3px; box-shadow: 0 12px 34px rgba(0,0,0,.6); }
    .sb-bar button { flex: 0 0 auto; white-space: nowrap; height: 29px; padding: 0 11px; border: 1px solid transparent;
      border-radius: 2px; background: transparent; color: #b9c6c1; cursor: pointer; }
    .sb-bar button:hover { background: rgba(100,216,180,.08); color: #fff; }
    .sb-bar button.is-on { border-color: rgba(240,163,94,.6); color: #f0a35e; background: rgba(240,163,94,.08); }
    .sb-bar .sb-sep { width: 1px; align-self: stretch; margin: 3px 3px; background: rgba(120,200,175,.16); }
    .sb-bar .sb-time { display: flex; align-items: center; padding: 0 8px; color: #7f8e88; font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace; white-space: nowrap; }

    /* ---- start overlay --------------------------------------------------------------------------------------- */
    .sb-start { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,8,7,.86);
      backdrop-filter: blur(4px); }
    .sb-start button { padding: 16px 30px; font: 15px/1 "Noto Sans SC", system-ui, sans-serif; color: #0b0f0d;
      background: #f0a35e; border: 0; border-radius: 2px; cursor: pointer; box-shadow: 0 10px 34px rgba(240,163,94,.3); letter-spacing: .04em; }
    .sb-start button:hover { background: #ffb974; }
    .sb-start__meta { display: block; margin-bottom: 10px; text-align: center; font-size: 10px; letter-spacing: .24em;
      color: #6f7d77; text-transform: uppercase; }

    @media (max-width: 980px) {
      .sb-panel { width: auto; right: 14px; bottom: 84px; max-height: 52vh; }
      .sb-stats { display: none; }
    }
  </style>
</head>
<body>
  <div id="field"></div>
  <aside id="sbPanel" class="sb-panel"></aside>
  <section class="sb-stats">
    <div class="sb-stats__head"><span class="micro">Live Telemetry</span><span class="micro" id="sbStateTag">READY</span></div>
    <div class="sb-stats__big"><b id="sbDamage">0</b><small>累计伤害</small></div>
    <dl>
      <dt>干员</dt><dd id="sbUnit">—</dd>
      <dt>技能</dt><dd id="sbSkill">—</dd>
      <dt>释放</dt><dd><b id="sbCasts">0</b> 次</dd>
      <dt>场上敌人</dt><dd id="sbEnemies">0</dd>
      <dt>击杀</dt><dd id="sbKills">0</dd>
      <dt>灼燃</dt><dd><b id="sbBursts">0</b> · <span id="sbBurn">0</span>/1000</dd>
      <dt id="sbBossPoolDt" hidden>BOSS 血池</dt><dd id="sbBossPool" hidden>—</dd>
      <dt id="sbBossStateDt" hidden>BOSS 状态</dt><dd id="sbBossState" hidden>—</dd>
      <dt>音效</dt><dd id="sbAudio">未开启</dd>
    </dl>
    <div class="sb-result" id="sbResult"></div>
  </section>
  <nav class="sb-bar">
    <button type="button" id="sbPlay">▌▌ 暂停</button>
    <button type="button" id="sbStep">▶| 单步</button>
    <button type="button" id="sbRestart">↻ 重来</button>
    <span class="sb-sep"></span>
    <button type="button" data-speed="1">1×</button>
    <button type="button" data-speed="2" class="is-on">2×</button>
    <button type="button" data-speed="4">4×</button>
    <button type="button" data-speed="8">8×</button>
    <span class="sb-sep"></span>
    <button type="button" id="sbCopy">🔗 复制链接</button>
    <span class="sb-time" id="sbTime">0.0 / 0 s</span>
  </nav>
  <script type="module" src="./sandbox.js"></script>
  <div id="sbStart" class="sb-start"><div><span class="sb-start__meta">Stronghold Protocol // Sandbox</span><button type="button" id="sbStartBtn">🔊 点击开始</button></div></div>
</body>
</html>
