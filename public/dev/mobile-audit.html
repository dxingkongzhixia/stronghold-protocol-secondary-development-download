  html, body.ma { margin: 0; background: #050807; }
  .ma-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999; display: flex; gap: 6px; padding: 6px;

  .ma-nav a { flex: 0 0 auto; padding: 6px 10px; color: #cfe; font: 600 12px/1 system-ui, sans-serif;
    text-decoration: none; border: 1px solid #2d4; border-radius: 6px; }
  .ma-nav a[aria-current="page"] { background: #2d4; color: #031; }
</style>
