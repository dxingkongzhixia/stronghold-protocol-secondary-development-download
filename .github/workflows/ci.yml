name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # One shard is a quarter of the suite (node --test-shard): the single full run took ~10 minutes locally and ~20 on
    # a runner, a shard stays well under it. 20 minutes keeps a margin and still fails a hung job.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 = the LTS line the whole suite runs on, one job per shard. Node 24 has its own light lane (`node24`).
        node: [22]
        # node --test-shard=<n>/4: together the four shards are exactly the full `npm test`
        shard: [1, 2, 3, 4]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      CI: '1'
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      # The full-match suites default to 6 seeds locally; CI keeps the full 20.
      MATCH_SEEDS: '20'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      - name: Unit & integration tests
        run: node tools/ci-shards.mjs --run ${{ matrix.shard }}

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  # Separate from the test matrix so lint / types / import boundaries run once, not four times.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Lint (warning budget 203)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck

  # The Node 24 lane: the other maintained LTS line gets a cheap check, not a second full suite. It runs the CI
  # wiring guards and the docs/package gates — the tests that exercise node's own test runner, glob and file APIs.
  node24:
    name: node 24 (guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Guard tests (CI wiring, docs gates, package plan)
        run: node --test test/ci.test.js test/docs-links.test.js test/docs-consistency.test.js test/docs-paths.test.js test/docs-mojibake.test.js test/package.test.js

  # The full golden corpus — not the `fast: true` subset the test job checks. A sim change merged without its golden
  # recompute leaves npm test green but this job red (the default diy drift of 2026-11-20 is the case that motivated it).
  golden:
    name: golden (full corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Golden — default data
        run: npm run golden

      - name: Golden — 规程 (act3autochess@V3_1)
        run: node tools/golden.mjs --version act3autochess@V3_1

  # P0 mobile matrix (docs/MOBILE-UI.md §7 M0.8): the mock page harness at public/dev/mobile-audit.html, measured at
  # 640×360 … 1024×768 with a simulated 24/24/34/24 safe area; screenshots are kept as the P1 comparison baseline.
  # It runs alone (the main job keeps RENDER_E2E=0) and starts its own server on port 0.
  mobile-audit:
    name: mobile-audit (640×360 … 1024×768)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: false

      # setup-chrome puts the binary on PATH; tools/mobile-audit.mjs also honours $CHROME_PATH and the platform defaults
      - name: Mobile audit
        run: npm run check:mobile

      - name: Screenshots (baseline / failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-screens
          path: test/e2e/out/mobile
          if-no-files-found: ignore
