# sp-relay — the art relay's nginx config (docs/ASSETS.md "The relay").
#
# Deployed by the relay's post-receive hook into 宝塔's vhost directory on 103.205.254.40
# (`/www/server/panel/vhost/nginx/sp-relay.conf`, included by `/www/server/nginx/conf/nginx.conf`): a push installs it
# and reloads nginx only when `nginx -t` accepts it. Manually:
#   scp -P 57435 tools/relay/sp-relay.nginx.conf root@103.205.254.40:/www/server/panel/vhost/nginx/sp-relay.conf
#   ssh -p 57435 root@103.205.254.40 '/www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload'
#
# It answers the SAME paths the game server does, so any asset URL can be prefixed with this origin:
#   /assets|/fonts|/vendor/**                       the same path under the served tree (/srv/sp/public)
#   /assets|/fonts|/vendor/~<hash>/**               the same WITHOUT the hash segment: `~<hash>` is the serving trick
#                                                   (shared/assetPaths.js), not a directory — server/http/files.js
#                                                   strips it, and the client's mirror prefix replaces it with `?h=`
#   /media/<path>  /media/~<hash>/<path>            public/assets/audio/<path>.mp3
#   /scene/<id>/meta  /scene/<id>/bin               public/assets/local/scene/<id>/scene.json | scene.bin
#   /clip/<name>                                    public/assets/loading/<name>.mp4
#
# REGEX LOCATIONS ARE FIRST-MATCH: the hashed rules must come BEFORE the plain-tree rule, or a hashed URL falls into the
# plain one and 404s (measured 2026-10-14 — it broke the browser cache, since the client's fallback then re-fetched the
# asset from another origin under a different URL).
#
# CACHE POLICY (2026-10-15). Anything that carries the content hash is content-addressed and may be cached for a year,
# exactly like the game server's `IMMUTABLE_CACHE`: the `/…/~<hash>/…` paths, and the plain paths the client's mirror
# prefix rewrites — those carry the hash as `?h=`. A plain path (no hash anywhere) keeps the conservative week, and so
# do the extension-less routes (their names are not content-addressed). This is what stops a regular player from
# re-downloading the ~135 MB cold set every time the week-old copy lapses.
map $arg_h $sp_art_cache {
    ""      "public, max-age=604800";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/sp/public;
    index index.html;

    # The client fetches cross-origin: images work without CORS, but the asset store's fetch()/createImageBitmap path
    # and the browser's own resource timing need it. `always` so an error response carries it too.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header Timing-Allow-Origin "*" always;
    # The default for everything that does NOT set its own Cache-Control (the extension-less routes, /): a week. The
    # art locations below override it (`add_header` is not inherited once a location sets one).
    add_header Cache-Control "public, max-age=604800" always;

    # --- content-hashed asset URLs, BEFORE the plain trees ------------------------------------------------------
    # Content-addressed by the path: safe for a year.
    location ~* "^/(assets|fonts|vendor)/~[0-9a-f]{16}/(.+)$" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Timing-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files "/$1/$2" $uri =404;
    }

    # --- bulk art: the client's URLs carry the hash as `?h=`, so those are immutable for a year; a plain path stays a
    # week. Ranges stay on for the boot clip ---------------------------------------------------------------------
    location ~* "^(/assets|/fonts|/vendor)/" {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Timing-Allow-Origin "*" always;
        add_header Cache-Control $sp_art_cache always;
        try_files $uri =404;
    }

    # --- the game's extension-less routes (same shape as the game server) ----------------------------------------
    # The ~<hash> segment is the serving trick and is NOT a directory: the game server strips it and resolves the rest
    # under public/assets. Both forms land on the same file.
    location ~ "^/media/~[0-9a-f]{16}/(.+)$" { try_files "/assets/audio/$1.mp3" =404; }
    location ~ "^/media/(.+)$"               { try_files "/assets/audio/$1.mp3" =404; }
    location ~ "^/scene/([^/]+)/meta$"       { try_files "/assets/local/scene/$1/scene.json" =404; }
    location ~ "^/scene/([^/]+)/bin$"        { try_files "/assets/local/scene/$1/scene.bin" =404; }
    location ~ "^/clip/([A-Za-z0-9_-]+)$"    { try_files "/assets/loading/$1.mp4" =404; }

    location / { try_files $uri =404; }
}
